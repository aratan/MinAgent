[project]
name = "minagent"
version = "1.0.0"
description = "A small terminal coding agent for OpenAI-compatible endpoints."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "regex>=2024.5.15",
]

[project.optional-dependencies]
# Kokoro is pinned, not ranged. 0.7.x dropped `repo_id` from KPipeline, which is
# what voz.py passes, and its model returns a fixed 0.25 s clip whatever the text
# is. `repo_id` came back in 0.8, and 0.9.4 synthesises correctly again.
voice = [
    "kokoro==0.9.4",
    "soundfile>=0.12",
]
# whisper.cpp is a compiled binary, not a wheel: see the compute-gpu skill.
transcribe = []
# read_document and create_pdf. CSV, JSON, DOCX, XLSX and text files are read
# with the standard library alone; only PDF reading and PDF writing need PyMuPDF.
documents = [
    "pymupdf>=1.24",
]

[project.scripts]
minagent = "minagent.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Some test modules import helpers from `tests.other_module`, which needs the
# project root on the path. Without this, the documented `uv run pytest` fails
# at collection with "No module named 'tests'" and only `python -m pytest` works.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E501: prompt text and tool descriptions are intentionally long single lines.
# B023: lambdas that close over loop variables are awaited within the same iteration.
# SIM105: the explicit try/except forms read more clearly than contextlib.suppress here.
ignore = ["E501", "B023", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "E731", "SIM905"]

[tool.mypy]
python_version = "3.12"
files = ["src/minagent"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/minagent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
