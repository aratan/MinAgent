name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Lint
        # Todo el repositorio, no solo el paquete: los scripts de scripts/ y de
        # las skills tambien tienen que pasar el lint o se pudren en silencio.
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test with coverage
        run: uv run pytest --cov --cov-report=term-missing
